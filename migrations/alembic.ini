# ==============================================================================
# LolAnalyzer Alembic Configuration
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = migrations

# Migration file naming template
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migrations
timezone = UTC

# Slug length limit
truncate_slug_length = 40

# Add repository root to python sys.path
prepend_sys_path = .

# Version locations
version_locations = migrations/versions

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)-5.5s] %(name)s: %(message)s
datefmt = %H:%M:%S
