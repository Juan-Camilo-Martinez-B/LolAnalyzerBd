name: Database CI & Migration Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & SQL Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Python Lint (flake8)
        run: |
          flake8 . --max-line-length=110 --exclude=.venv,env,migrations/versions

      - name: Run SQLFluff Lint
        run: |
          sqlfluff lint schemas/ migrations/sql/ --dialect postgres

  test-postgres:
    name: PostgreSQL Migration & Integrity Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lol_admin
          POSTGRES_PASSWORD: lol_secure_password_2026
          POSTGRES_DB: lol_analyzer_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Schema Initialization & Seeds
        env:
          DB_ENGINE: postgresql
          POSTGRES_USER: lol_admin
          POSTGRES_PASSWORD: lol_secure_password_2026
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: lol_analyzer_db
          DATABASE_URL: postgresql://lol_admin:lol_secure_password_2026@localhost:5432/lol_analyzer_db
        run: |
          python scripts/manage_db.py init
          python scripts/manage_db.py seed
          python scripts/manage_db.py status

      - name: Run Test Suite (pytest)
        env:
          DB_ENGINE: postgresql
          DATABASE_URL: postgresql://lol_admin:lol_secure_password_2026@localhost:5432/lol_analyzer_db
        run: |
          pytest scripts/test_db.py tests/ -v
